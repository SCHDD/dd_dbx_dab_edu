# A sample job for dd_dbx_dab_edu.

resources:
  jobs:
    sch_game_rank:
      name: sch_game_rank
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: /Volumes/training/sch/study_volume/games_ranking.csv/
      tasks:
        - task_key: bronze_game_rank
          notebook_task:
            notebook_path: ../src/(Clone) bronze_game_data.ipnyb
            source: WORKSPACE
        - task_key: silver_game_rank
          depends_on:
            - task_key: bronze_game_rank
          notebook_task:
            notebook_path: ../src/(Clone) silver_game_data.ipnyb
            source: WORKSPACE
        - task_key: gold_game_rank
          depends_on:
            - task_key: silver_game_rank
          notebook_task:
            notebook_path: ../src/(Clone) gold_game_data.ipnyb
            source: WORKSPACE
      queue:
        enabled: true
      run_as:
        service_principal_name: e997f61b-4e21-4b6e-b254-ad0843fb0c97
      performance_target: PERFORMANCE_OPTIMIZED

